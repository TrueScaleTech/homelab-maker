[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "homelab-maker"
dynamic = ["version"]
description = "Draw your homelab on a grid and ask what can reach what."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "TrueScaleTech" }]
keywords = ["homelab", "network", "diagram", "topology", "planning", "desktop"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4.2",
    # Widgets only, which keeps the install far smaller than "PySide6".
    "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/TrueScaleTech/homelab-maker"
Issues = "https://github.com/TrueScaleTech/homelab-maker/issues"

[tool.hatch.version]
path = "src/homelab_maker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_maker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is how pytest works
# Qt's methods are camelCase, and overriding one means using its name.
"src/homelab_maker/gui/*" = ["N802"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
