name: Bug report
description: Something does not work as the README says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not paste real network data.** Addresses, hostnames and device names
        describe a real network. Replace them with invented ones (`192.168.1.10`,
        `nas.home`), or attach a project file made of invented devices.
        For a security problem, use the private link under "Report a vulnerability" instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: The clicks you made in the window, or a small project file that shows it.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in the About box, or in the installer's file name.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it run?
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
